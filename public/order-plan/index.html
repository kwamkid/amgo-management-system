<div id="app"></div>
<div class="lb" id="lb" role="dialog" aria-modal="true">
  <button class="x" aria-label="ปิด" data-close>×</button>
  <button class="nav prev" aria-label="ก่อนหน้า">‹</button>
  <figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure>
  <button class="nav next" aria-label="ถัดไป">›</button>
</div>
<script>
const $ = s => document.querySelector(s);
const fmt = (n, d = 0) => n == null || isNaN(n) ? '—' : Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const SYM = { USD: '$', EUR: '€', GBP: '£', RMB: '¥', CNY: '¥' };
// money in table cells: number then its currency sign (owner 2026-10-29) — fc = the order's currency, thb = baht
const fc = (n, d = 2) => n == null || isNaN(n) ? '—' : `${fmt(n, d)}<span class="sym">${SYM[plan.currency] || plan.currency}</span>`;
const thb = n => n == null || isNaN(n) ? '—' : `${fmt(n, 0)}<span class="sym">฿</span>`;
const STATUS = { draft: 'ร่าง', approved: 'อนุมัติแล้ว', sent: 'ส่งแล้ว' };
// amgo (owner 30 Oct 2026): container no. per brand per year in front of the container name — "Hape 2026 #5 · ตู้ 2026-C1"
const logo1 = u => u ? `<img class="blogo" src="${esc(u)}" alt="">` : '';
const logo = r => !r ? '' : r.parts && r.parts.length > 1 ? r.parts.map(p => logo1(p.logo)).join('') : logo1(r.logo);
// container no. replaces the round code in headings (owner 30 Oct 2026: "ตู้ที่ 5")
const rno = r => r.shipNo ? '#' + r.shipNo : esc(r.round);

async function openPlan(p) {
  planPath = p; dir = p.replace(/plan\.json$/, ''); unlocked = false;
  const r = await fetch('/api/import/plan?p=' + encodeURIComponent(p));
  if (!r.ok) { $('#app').innerHTML = `<main><div class="empty">เปิดไม่ได้: ${esc(p)}</div></main>`; return; }
  plan = await r.json();
  document.body.classList.toggle('no-cost', plan._seeCost === false);
  savedQ = new Map(plan.items.map(i => [i.code, qkey(i)]));
  // amgo speed: the server sends the round + prices in one response (RPC import_plan) — no extra calls on open
  srp = plan._srp || { prices: {} }; aoo = plan._aoo || { prices: {} }; pricesAt = Date.now();
  const matesP = (async () => {
    // other order files that ship in the same container (separate brand forms, one box to fill)
    mates = plan.container && (plan._mates || []).length ? (await (await fetch('/api/import/rounds')).json()).filter(x => x.container === plan.container && x.path !== p) : [];
    // their lines too, so the footer can show each file's selling value
    await Promise.all(mates.map(async x => { try { x.items = (await (await fetch('/api/import/plan?p=' + encodeURIComponent(x.path))).json()).items || []; } catch { x.items = []; } }));
  })();
  await matesP;
  document.title = `${plan.shipNo ? '#' + plan.shipNo : plan.round} ${plan.sub || plan.brand} — แผนสั่งของ`;
  renderShell(); renderRows(); renderTotals();
}

let pricesAt = 0;
async function loadSrp() {
  // real shelf prices in aoo win when aoo already sells the model — fetched alongside the SRP prices
  const aooP = fetch('/api/import/aoo-prices?brand=' + encodeURIComponent(plan.aooBrand || plan.brand))
    .then(r => r.ok ? r.json() : { prices: {} }).catch(() => ({ prices: {} }));
  // amgo: one round can hold several brands (Hape + J'adore) — merge each brand's SRP Calculator prices
  const names = plan.srpBrands && plan.srpBrands.length ? plan.srpBrands : [plan.srpBrand || plan.sub || plan.brand];
  const got = await Promise.all(names.map(async name => {
    try {
      const r = await fetch('/api/import/srp?brand=' + encodeURIComponent(name));
      const j = r.ok ? await r.json() : { prices: {}, error: 'ดึงราคาไม่ได้' };
      if (r.ok && !j.brand) j.error = `ไม่พบแบรนด์ "${name}" ใน SRP Calculator`;
      return j;
    } catch { return { prices: {}, error: 'ดึงราคาไม่ได้' }; }
  }));
  srp = { ...got[0], prices: Object.assign({}, ...got.map(g => g.prices)), error: got.find(g => g.error)?.error };
  aoo = await aooP;
  pricesAt = Date.now();
}
// re-read prices when coming back from the SRP Calculator tab
// amgo speed: at most every 10 minutes, and only redraw when a price actually changed
addEventListener('focus', async () => {
  if (!plan || Date.now() - pricesAt < 600000) return;
  const before = JSON.stringify([srp.prices, aoo.prices]);
  await loadSrp();
  if (JSON.stringify([srp.prices, aoo.prices]) === before) return;
  renderSrpLink(); renderRows(); renderTotals();
});

// amgo: read-only viewers (brand managers, can_edit false) are always locked
const locked = () => plan._canEdit === false || (plan.status === 'sent' && !unlocked);
const cur = () => SYM[plan.currency] || plan.currency + ' ';
const ctns = i => i.casePack ? Math.ceil((i.qty || 0) / i.casePack) : 0;
// selling price: ours if we have one, else the brand's SRP converted to baht
// selling price: SRP Calculator (amgo-management) → price agreed in our notes but not yet in the calculator → brand SRP × fx
const sell = i => {
  const a = aoo.prices[String(i.barcode || '').trim()] || aoo.prices[String(i.code).trim().toUpperCase()];
  if (a && a.price > 0) return { v: a.price, disc: a.discount, src: 'aoo' };
  const c = srp.prices[String(i.code).trim()];
  if (c && c.ourPrice > 0) return { v: c.ourPrice, src: 'calc' };
  if (i.ourPrice != null && i.ourPrice !== '') return { v: +i.ourPrice, src: 'agreed' };
  return i.srp ? { v: i.srp * plan.fx, src: 'srp' } : { v: null, src: '' };
};
// stock (only rounds that carry it): now = sellable in aoo · incoming = on a brand invoice not yet received
const hasStock = () => plan.items.some(i => i.stock != null);
const after = i => (i.stock || 0) + (i.incoming || 0) + (i.qty || 0);
// months of sales the stock covers; rounds with `leadMonths` count from the day the order lands (sales until then come off)
const cover = (i, n) => i.avg > 0 ? Math.max(0, n / i.avg - (plan.leadMonths || 0)) : null;
const overM = () => plan.overMonths || 6;
const NCOL = () => 17 + (hasStock() ? 6 : 0);
const SORT = {
  stock: i => i.stock || 0, nowc: i => i.avg > 0 ? (i.stock || 0) / i.avg : 99, inc: i => i.incoming || 0, avg: i => i.avg || 0, after: i => after(i), cov: i => cover(i, after(i)) ?? -1,
  code: i => Number(i.code) || 0, name: i => i.name.toLowerCase(), barcode: i => String(i.barcode),
  fob: i => i.fob || 0, srp: i => i.srp || 0, sell: i => sell(i).v || 0, src: i => sell(i).src,
  qty: i => i.qty || 0, ctn: i => ctns(i), pdq: i => i.qtyPdq || 0, pack: i => i.casePack || 0,
  cbm: i => i.cbm || 0, tfob: i => (i.qty || 0) * (i.fob || 0), tcbm: i => ctns(i) * (i.cbm || 0),
};
const th = (key, label, cls = '') => `<th class="${cls}" data-sort="${key}">${label}<span class="arr">${sortKey === key ? (sortDir > 0 ? '▲' : '▼') : ''}</span></th>`;

  <main><div class="wrap"><table>

// [category, items, ordered] in the plan's own order — the category filter
const tally = (items, key) => { const m = new Map(); items.forEach(i => { const g = i[key]; if (!g) return; const c = m.get(g) || [g, 0, 0]; c[1]++; if (i.qty > 0) c[2]++; m.set(g, c); }); return [...m.values()]; };
const cats = () => tally(plan.items, 'group');
// sub-categories / channels (brand order forms that have them, e.g. Hape) — sub-categories follow the chosen category
const subs = () => tally(plan.items.filter(i => !cat || i.group === cat), 'sub').sort((a, b) => a[0].localeCompare(b[0]));
const chans = () => tally(plan.items, 'channel').sort((a, b) => a[0].localeCompare(b[0]));
// NEW = never sold yet (owner 2026-10-29: filter new products) · the rest = models we already sell
const subsOf = g => [...new Set(plan.items.filter(i => i.group === g && i.sub && i.sub !== g).map(i => i.sub))].sort();
const kindOf = i => (i.tags || []).includes('new') ? 'NEW ยังไม่เคยขาย' : 'ขายอยู่แล้ว';
const kinds = () => tally(plan.items.map(i => ({ ...i, kind: kindOf(i) })), 'kind');

// container tabs keep one fixed order whichever file is open: main brand first, then sub-brands by name
const tabOrder = (a, b) => (a.sub ? 1 : 0) - (b.sub ? 1 : 0) || String(a.sub || '').localeCompare(String(b.sub || '')) || a.path.localeCompare(b.path);
// picture of a category / sub-category = its best seller (else the biggest line ordered)
const hero = (key, g) => {
  const f = key === 'group' ? i => i.group === g : i => i.sub === g && (!cat || i.group === cat);
  const h = plan.items.filter(i => f(i) && i.img).sort((a, b) => (b.avg || 0) - (a.avg || 0) || (b.qty || 0) - (a.qty || 0))[0];
  return h ? h.img : '';
};
// dropdown with pictures — vanilla port of aoo's FormSelect (one open at a time, outside click / Esc closes)
// "NEW …" option text → the red NEW badge in front of the rest
const newLabel = t => /^NEW /.test(t) ? `<span class="badge b-new">NEW</span> ${esc(t.slice(4))}` : esc(t);
function fsHtml(id, label, list, val, key) {

    .concat(list.map(([g, n, k]) => [g, g, `${k ? `สั่ง ${k} · ` : ''}${fmt(n)} รุ่น${key === 'group' && subsOf(g).length > 1 ? ' · ' + subsOf(g).slice(0, 3).join(', ') + (subsOf(g).length > 3 ? '…' : '') : ''}`, key ? hero(key, g) : '']));
  return `<div class="fs ${val ? 'active' : ''}" id="${id}">
    <button type="button" class="fs-trig">${key ? ico(cur ? hero(key, val) : '') : ''}<span class="t">${cur ? newLabel(val) : `<small>${label}:</small> ทั้งหมด`}</span>
      <svg class="chev" viewBox="0 0 20 20" fill="currentColor"><path d="M5.3 7.3a1 1 0 0 1 1.4 0L10 10.6l3.3-3.3a1 1 0 1 1 1.4 1.4l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 0 1 0-1.4z"/></svg></button>
    <div class="fs-panel">${opts.length > 8 ? '<div class="fs-search"><input type="text" placeholder="ค้นหา…"></div>' : ''}
      <div class="fs-list">${opts.map(([v, lb, sub, img]) => `<button type="button" class="fs-opt ${v === val ? 'sel' : ''}" data-v="${esc(v)}" data-kw="${esc(key === 'group' && v ? subsOf(v).join(' ') : '')}">
        ${key ? ico(img) : ''}<span class="fs-lb">${newLabel(lb)}<span class="fs-sub">${sub}</span></span><span class="ck">✓</span></button>`).join('')}</div></div></div>`;
}
// category + sub-category in ONE picture dropdown (owner 2026-10-29): category rows, their sub-categories indented
// under them; value = "c§<cat>" or "s§<cat>§<sub>"
function catHtml() {
  const ico = src => src ? `<img class="fs-ico" src="${src}" alt="" loading="lazy">` : '<span class="fs-ico ph"></span>';
  const pic = (g, sb) => { const h = plan.items.filter(i => i.group === g && (!sb || i.sub === sb) && i.img)
    .sort((a, b) => (b.avg || 0) - (a.avg || 0) || (b.qty || 0) - (a.qty || 0))[0]; return h ? h.img : ''; };
  const cnt = (n, k) => `${k ? `สั่ง ${k} · ` : ''}${fmt(n)} รุ่น`;
  const val = sub ? `s§${cat}§${sub}` : cat ? `c§${cat}` : '';
  const rows = [{ v: '', lb: 'หมวด: ทั้งหมด', sb: cnt(plan.items.length, plan.items.filter(i => i.qty > 0).length), img: '', lvl: 0, kw: '' }];
  for (const [g, n, k] of cats()) {
    rows.push({ v: `c§${g}`, lb: g, sb: cnt(n, k), img: pic(g), lvl: 0, kw: subsOf(g).join(' ') });
    const ss = tally(plan.items.filter(i => i.group === g), 'sub').filter(x => x[0] !== g);
    if (ss.length > 1) for (const [sg, sn, sk] of ss.sort((a, b) => a[0].localeCompare(b[0])))
      rows.push({ v: `s§${g}§${sg}`, lb: sg, sb: cnt(sn, sk), img: pic(g, sg), lvl: 1, kw: g });

function fsBind(id, onPick) {
  const box = $('#' + id); if (!box) return;
  const list = [...box.querySelectorAll('.fs-opt')], q = box.querySelector('.fs-search input');
  let hi = -1;
  const shown = () => list.filter(o => o.style.display !== 'none');
  const mark = () => list.forEach(o => o.classList.toggle('hi', shown()[hi] === o));
  box.querySelector('.fs-trig').onclick = e => {
    e.stopPropagation();
    const wasOpen = box.classList.contains('open');
    document.querySelectorAll('.fs.open').forEach(x => x.classList.remove('open'));
    if (!wasOpen) { box.classList.add('open'); hi = -1; if (q) { q.value = ''; list.forEach(o => o.style.display = ''); setTimeout(() => q.focus(), 30); } }
  };
  box.querySelector('.fs-panel').onclick = e => e.stopPropagation();
  list.forEach(o => o.onclick = () => { box.classList.remove('open'); onPick(o.dataset.v); });
  if (q) q.oninput = () => { const t = q.value.trim().toLowerCase(); list.forEach(o => o.style.display = !t || (o.textContent + ' ' + (o.dataset.kw || '')).toLowerCase().includes(t) ? '' : 'none'); hi = t ? 0 : -1; mark(); };
  box.onkeydown = e => {
    if (!box.classList.contains('open')) return;
    const n = shown().length;
    if (e.key === 'ArrowDown') { e.preventDefault(); hi = Math.min(hi + 1, n - 1); mark(); shown()[hi]?.scrollIntoView({ block: 'nearest' }); }
    if (e.key === 'ArrowUp') { e.preventDefault(); hi = Math.max(hi - 1, 0); mark(); shown()[hi]?.scrollIntoView({ block: 'nearest' }); }
    if (e.key === 'Enter' && shown()[hi]) { e.preventDefault(); shown()[hi].click(); }

}

        <td class="num cost">${fc(cFob, 0)}</td><td class="num cost">${thb(cThb)}</td><td class="num sell">${thb(sum('retail'))}</td><td class="num">${fmt(cCbm, 2)}</td></tr></tfoot></table>
    <div class="ctr-side">
      <div class="cont big ${pct > 100 ? 'over' : ''}"><div class="t"><span>ตู้ ${esc(conts.find(c => c[1] === cap)[0])} · ${fmt(cCbm, 1)} / ${cap} CBM</span><b>${fmt(pct, 0)}%</b></div><div class="bar"><i style="width:${Math.min(pct, 100)}%"></i></div>
        <div class="t">${pct > 100 ? `<span class="cov-low">เกิน ${fmt(cCbm - cap, 1)} CBM</span>` : `<span>เหลือที่ ${fmt(cap - cCbm, 1)} CBM</span>`}</div></div>
      ${hasStock() ? `<div class="kpi"><div class="l">สั่งเกิน ${overM()} เดือน</div><div class="v ${o.some(i => (cover(i, after(i)) || 0) > overM()) ? 'cov-low' : ''}">${fmt(o.filter(i => (cover(i, after(i)) || 0) > overM()).length)} รุ่น</div></div>` : ''}
    </div>`;
    $('#tot').insertAdjacentHTML('beforeend', totToggle());
    $('#tot').querySelectorAll('tr[data-go]').forEach(r => r.onclick = () => { location.hash = 'p=' + encodeURIComponent(r.dataset.go); });
    return bindTotToggle();
  }
  $('#tot').innerHTML = `
    <div class="kpi"><div class="l">รายการ</div><div class="v">${fmt(o.length)}</div></div>
    <div class="kpi"><div class="l">ชิ้น</div><div class="v">${fmt(pcs)}</div></div>
    <div class="kpi"><div class="l">กล่อง</div><div class="v">${fmt(ct)}</div></div>
    <div class="kpi cost"><div class="l">ยอดที่ต้องจ่าย (${esc(plan.incoterm || 'FOB')})</div><div class="v big">${fc(fob, 2)}</div></div>
    <div class="kpi cost"><div class="l">เป็นเงินบาท @ ${fmt(plan.fx, 2)}</div><div class="v big">${thb(fob * plan.fx)}</div></div>
    <div class="kpi"><div class="l">มูลค่าขาย (ราคาเรา/SRP)</div><div class="v">${thb(retail)}</div></div>
    ${hasStock() ? `<div class="kpi"><div class="l">สั่งเกิน ${overM()} เดือน</div><div class="v ${o.some(i => (cover(i, after(i)) || 0) > overM()) ? 'cov-low' : ''}">${fmt(o.filter(i => (cover(i, after(i)) || 0) > overM()).length)} รุ่น</div></div>` : ''}
    <div class="kpi"><div class="l">CBM${o.some(i => !i.cbm) ? ` <span class="cov-low">(ไม่มีขนาดกล่อง ${o.filter(i => !i.cbm).length} รายการ)</span>` : ''}</div><div class="v big">${fmt(cbm, 2)}</div></div>
    ${mates.length ? `<div class="kpi ctr cost"><div class="l">ทั้ง${ctrName(plan.container, plan)} (${mates.length + 1} ไฟล์)</div><div class="v">${fc(cFob, 0)} · ${thb(cThb)}</div></div>
    <div class="kpi"><div class="l">CBM ทั้งตู้${cNo ? ` <span class="cov-low">(ไม่มีขนาด ${cNo})</span>` : ''}</div><div class="v big">${fmt(cCbm, 2)}</div></div>` : ''}
    <div class="boxes">${conts.map(([k, cap]) => { const p = (mates.length ? cCbm : cbm) / cap * 100; return `
      <div class="cont ${p > 100 ? 'over' : ''}"><div class="t"><span>ตู้ ${esc(k)} (${cap})</span><span>${fmt(p, 0)}%</span></div><div class="bar"><i style="width:${Math.min(p, 100)}%"></i></div></div>`; }).join('')}</div>${totToggle()}`;
  bindTotToggle();
}

/* edits */
document.addEventListener('change', e => {
  const t = e.target, tr = t.closest('tr[data-i]');
  if (!tr || !t.dataset.f) return;
  const i = plan.items[+tr.dataset.i];
  if (t.dataset.f === 'qty') i.qty = Math.max(0, parseInt(t.value) || 0);
  if (t.dataset.f === 'ctn') i.qty = Math.max(0, parseInt(t.value) || 0) * (i.casePack || 1); // order in full cartons
  if (t.dataset.f === 'qty' || t.dataset.f === 'ctn') i.edited = i.qty !== i.suggested;  // the builder keeps edited lines
  if (t.dataset.f === 'ourPrice') { i.ourPrice = t.value === '' ? null : +t.value; i.ourPriceSrc = t.value === '' ? '' : 'edited ' + new Date().toISOString().slice(0, 10); }
  tr.outerHTML = rowHtml(i, +tr.dataset.i, tr.querySelector('.stick0').textContent);  // keep the row number
  renderTotals(); save();
});
document.addEventListener('click', e => {
  // category / sub-category / channel under a product name → filter by it (owner 2026-10-29)
  const fk = e.target.closest('[data-fk]');
  if (fk) {
    const v = fk.dataset.fv;
    if (fk.dataset.fk === 'cat') { cat = v; sub = ''; }
    if (fk.dataset.fk === 'sub') { cat = fk.dataset.fg; sub = v; }
    if (fk.dataset.fk === 'chan') chan = v;
    page = 1; renderChips(); renderRows(); $('.wrap').scrollTop = 0;
    return;
  }
  const z = e.target.closest('[data-zoom]'); if (z) return openLb(+z.dataset.zoom);
  const r = e.target.closest('[data-round]');
  const s = e.target.closest('[data-sugg]');
  const el = r || s; if (!el || locked()) return;
  const idx = +(r ? r.dataset.round : s.dataset.sugg), i = plan.items[idx];
  i.qty = r ? ctns(i) * i.casePack : i.suggested;
  i.edited = !!r && i.qty !== i.suggested;  // taking the suggestion = no longer an own edit
  const row = document.querySelector(`tr[data-i="${idx}"]`);
  row.outerHTML = rowHtml(i, idx, row.querySelector('.stick0').textContent);
  renderTotals(); save();
});

let savedQ = new Map();
const qkey = i => `${i.qty || 0}|${!!i.edited}`;
function save() {
  const el = $('#save'); el.className = 'save'; el.textContent = 'กำลังบันทึก…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      // amgo speed: send only the lines whose qty changed since the last save (not all ~900)
      const dirty = plan.items.filter(i => savedQ.get(i.code) !== qkey(i));
      const r = await fetch('/api/import/plan?p=' + encodeURIComponent(planPath), { method: 'PUT',
        body: JSON.stringify({ status: plan.status, fx: plan.fx, items: dirty.map(i => ({ code: i.code, qty: i.qty, edited: !!i.edited })) }) });
      if (!r.ok) throw new Error(r.status);
      dirty.forEach(i => savedQ.set(i.code, qkey(i)));
      el.textContent = 'บันทึกแล้ว ' + new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
    } catch (err) { el.className = 'save err'; el.textContent = 'บันทึกไม่ได้ — ลองใหม่'; }
    saveTimer = null;  // nothing pending — safe for checkVersion() to reload
  }, 500);
}

/* lightbox */
let lbList = [], lbPos = 0;
function openLb(idx) {
  lbList = visible().filter(i => i.img).map(i => plan.items.indexOf(i));
  lbPos = Math.max(0, lbList.indexOf(idx)); showLb(); $('#lb').classList.add('on');
}
function showLb() {
  const i = plan.items[lbList[lbPos]];
  $('#lbImg').src = i.img;
  $('#lbCap').textContent = `${i.code} · ${i.name}${i.barcode ? ' · ' + i.barcode : ''}`;
}
const closeLb = () => $('#lb').classList.remove('on');
$('#lb').addEventListener('click', e => {
  if (e.target.closest('.prev')) { lbPos = (lbPos - 1 + lbList.length) % lbList.length; return showLb(); }
  if (e.target.closest('.next')) { lbPos = (lbPos + 1) % lbList.length; return showLb(); }
  if (e.target.closest('img')) return;
  closeLb(); // backdrop, caption or ×
});
addEventListener('keydown', e => {
  if (!$('#lb').classList.contains('on')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') { lbPos = (lbPos - 1 + lbList.length) % lbList.length; showLb(); }
  if (e.key === 'ArrowRight') { lbPos = (lbPos + 1) % lbList.length; showLb(); }
});

route();
</script>
</body>
</html>
